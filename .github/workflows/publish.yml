name: Publish

# Publishes to npm via trusted publishing (OIDC) — no npm token or OTP.
# Requires a trusted publisher on npmjs.com: seob717/redash-mcp, workflow publish.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      - name: Run tests
        run: npm test

      # Skips an already-published version so a failed run can be re-run safely.
      - name: Publish to npm
        run: |
          SPEC="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          npm view "$SPEC" version >/dev/null 2>&1 || npm publish

      # npm takes a few minutes to expose a new version; the MCP Registry checks it exists.
      - name: Publish to MCP Registry
        run: |
          SPEC="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          for i in $(seq 1 30); do npm view "$SPEC" version >/dev/null 2>&1 && break; sleep 20; done
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
